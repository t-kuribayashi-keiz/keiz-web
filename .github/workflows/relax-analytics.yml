name: Relax analytics

# リラックスの分析環境。サービスアカウント relax-reporter で GA4(Admin API / Data API)と
# Search Console に何が見えているか・実際の指標値を取得する。
#
#   mode=discover … どのプロパティ/サイトが見えるかの疎通確認だけ(実指標は取らない)
#   mode=pull     … 対象月のセッション数・表示回数等の実指標を取得し、TSVをログに出す
#
# **読み取り専用。** GA4にもSearch Consoleにも書き込まない。リポジトリにも書き込まない
# (TSVはこのジョブのログにのみ出す。実データをリポジトリにコミットしない)。
#
# 鍵はリポジトリシークレット GCP_RELAX_KEY にのみ置く。Claudeのセッションには渡らない。

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "院マスタのブランド名"
        required: true
        type: string
        default: リラックス
      mode:
        description: "discover=疎通確認だけ / pull=対象月の実指標を取得"
        required: true
        type: choice
        options:
          - discover
          - pull
        default: discover
      scope:
        description: "確認・取得する対象(discover/pull共通)"
        required: true
        type: choice
        options:
          - both
          - ga4
          - gsc
        default: both
      month:
        description: "mode=pull のときだけ使う対象年月号(例 2026年08月号)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # jpholiday は hpb_slot_check.py の依存。このワークフローでは使わないが、
        # 下のテスト実行が tests/ 全体を読むので、入っていないと import で落ちる。
        run: pip install --quiet google-auth google-api-python-client jpholiday

      - name: Check the parts that need no credentials
        run: python3 -m unittest discover -s tests

      - name: Discover
        if: inputs.mode == 'discover'
        env:
          GCP_RELAX_KEY: ${{ secrets.GCP_RELAX_KEY }}
          TZ: Asia/Tokyo
        run: |
          case "${{ inputs.scope }}" in
            ga4) flag="--skip-gsc" ;;
            gsc) flag="--skip-ga4" ;;
            *)   flag="" ;;
          esac
          python3 scripts/analytics_discover.py --brand "${{ inputs.brand }}" $flag

      - name: Pull
        if: inputs.mode == 'pull'
        env:
          GCP_RELAX_KEY: ${{ secrets.GCP_RELAX_KEY }}
          TZ: Asia/Tokyo
        run: |
          if [ -z "${{ inputs.month }}" ]; then
            echo "mode=pull には month の指定が必要です(例: 2026年08月号)" >&2
            exit 1
          fi
          case "${{ inputs.scope }}" in
            ga4) flag="--skip-gsc" ;;
            gsc) flag="--skip-ga4" ;;
            *)   flag="" ;;
          esac
          python3 scripts/analytics_pull.py --brand "${{ inputs.brand }}" \
            --month "${{ inputs.month }}" $flag
