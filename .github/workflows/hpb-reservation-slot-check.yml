name: HPB reservation slot check

# K/L列: HotPepper Beauty公開カレンダーを毎日スクレイピングして○/✕/?を判定
# (scripts/hpb_slot_check.py, 旧「予約枠」Colabノートブックの移植)
#
# ✕になった枠の原因切り分け(M/N列)はここでは自動化しない(2026-09-03、栗林さんの判断)。
# ルールベースの判定だと精度が不安定になるため、当面は栗林さんが「今週分お願い」と
# 声をかけたタイミングで、Claudeが実Chrome(SalonBoardの実セッション)を使って目視確認する
# 運用にする。.claude/skills/hpb-reservation-slot-check/SKILL.md 参照。
#
# 認証情報はすべてリポジトリシークレットに置き、Claudeセッションには渡さない。
# GCP_KPI_WRITER_KEY は functions/kpi-aggregation で使っている書き込み用サービスアカウント
# (chokuei-sunsumirai-kpi-writer@keizgroup-automation.iam.gserviceaccount.com) を流用。
# 新規に鍵を作る必要はなく、「HPB予約枠確認」スプレッドシートをこのアカウントに
# 編集者共有するだけでよい。

on:
  # 定期実行(schedule)は2026-09-11に停止した(栗林さん指示)。
  # 理由: 発火が想定13:07 JSTから恒常的に4〜5時間遅れ(17:30〜18:15 JST)ており、
  # 当日PMの経過済み時間帯を「予約不可」と誤検知して✕が大量発生する実害が出た
  # (ある実行で○111/✕26 → 数時間後の遅延実行で○16/✕121に激変)。
  # 原因(遅延そのもの、および遅い時刻の実行が構造的に誤検知を生む設計)が直るまで、
  # 手動実行(workflow_dispatch)のみで運用する。再開する際は、この停止理由が
  # 解消されたことを確認してから schedule ブロックを戻すこと。
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run=書き込まず確認 / apply=本番書き込み"
        type: choice
        options:
          - dry-run
          - apply
        default: apply
      start_date:
        description: "省略可。臨時でチェック窓を変えたいときだけYYYY-MM-DDを指定(例: 2026-09-04)"
        type: string
        required: false
      start_half:
        description: "省略可。start_dateを指定した場合のみ使う"
        type: choice
        options: ["", AM, PM]
        default: ""
      end_date:
        description: "省略可。臨時でチェック窓を変えたいときだけYYYY-MM-DDを指定"
        type: string
        required: false
      end_half:
        description: "省略可。end_dateを指定した場合のみ使う"
        type: choice
        options: ["", AM, PM]
        default: ""

concurrency:
  group: hpb-reservation-slot-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  slot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet gspread google-auth jpholiday playwright
          playwright install --with-deps chromium

      - name: Check the parts that need no credentials
        run: python3 -m unittest discover -s tests -p "test_hpb_slot_check.py" -v

      - name: Run K/L scraper (公開カレンダー)
        env:
          GCP_KPI_WRITER_KEY: ${{ secrets.GCP_KPI_WRITER_KEY }}
          TZ: Asia/Tokyo
        run: |
          args=()
          [ "${{ github.event.inputs.mode || 'apply' }}" = "apply" ] && args+=(--apply)
          [ -n "${{ github.event.inputs.start_date }}" ] && args+=(--start-date "${{ github.event.inputs.start_date }}")
          [ -n "${{ github.event.inputs.start_half }}" ] && args+=(--start-half "${{ github.event.inputs.start_half }}")
          [ -n "${{ github.event.inputs.end_date }}" ] && args+=(--end-date "${{ github.event.inputs.end_date }}")
          [ -n "${{ github.event.inputs.end_half }}" ] && args+=(--end-half "${{ github.event.inputs.end_half }}")
          python3 scripts/hpb_slot_check.py "${args[@]}"
