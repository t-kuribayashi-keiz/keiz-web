name: HPB reservation slot check

# K/L列: HotPepper Beauty公開カレンダーを毎日スクレイピングして○/✕/?を判定
# (scripts/hpb_slot_check.py, 旧「予約枠」Colabノートブックの移植)
#
# ✕になった枠の原因切り分け(M/N列)はここでは自動化しない(2026-09-03、栗林さんの判断)。
# ルールベースの判定だと精度が不安定になるため、当面は栗林さんが「今週分お願い」と
# 声をかけたタイミングで、Claudeが実Chrome(SalonBoardの実セッション)を使って目視確認する
# 運用にする。.claude/skills/hpb-reservation-slot-check/SKILL.md 参照。
#
# 認証情報はすべてリポジトリシークレットに置き、Claudeセッションには渡さない。
# GCP_KPI_WRITER_KEY は functions/kpi-aggregation で使っている書き込み用サービスアカウント
# (chokuei-sunsumirai-kpi-writer@keizgroup-automation.iam.gserviceaccount.com) を流用。
# 新規に鍵を作る必要はなく、「HPB予約枠確認」スプレッドシートをこのアカウントに
# 編集者共有するだけでよい。

on:
  schedule:
    # 毎日12:00 JST (03:00 UTC)。2026-10-03に再開(栗林さん指示)。
    # 9/11に停止した理由は、発火が4〜5時間遅れて当日PMの経過済み時間帯を誤って✕と
    # 判定したこと。再開にあたり、scripts/hpb_slot_check.py の default_date_window() に
    # 遅延ガードを入れた(14:00 JST以降の実行は当日を除き翌日AMから判定)。
    # 数分〜十数分の遅れは許容。
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run=書き込まず確認 / apply=本番書き込み"
        type: choice
        options:
          - dry-run
          - apply
        default: apply
      start_date:
        description: "省略可。臨時でチェック窓を変えたいときだけYYYY-MM-DDを指定(例: 2026-09-04)"
        type: string
        required: false
      start_half:
        description: "省略可。start_dateを指定した場合のみ使う"
        type: choice
        options: ["", AM, PM]
        default: ""
      end_date:
        description: "省略可。臨時でチェック窓を変えたいときだけYYYY-MM-DDを指定"
        type: string
        required: false
      end_half:
        description: "省略可。end_dateを指定した場合のみ使う"
        type: choice
        options: ["", AM, PM]
        default: ""

concurrency:
  group: hpb-reservation-slot-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  slot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet gspread google-auth jpholiday playwright
          playwright install --with-deps chromium

      - name: Check the parts that need no credentials
        run: python3 -m unittest discover -s tests -p "test_hpb_slot_check.py" -v

      - name: Run K/L scraper (公開カレンダー)
        id: run
        env:
          GCP_KPI_WRITER_KEY: ${{ secrets.GCP_KPI_WRITER_KEY }}
          SLOT_CHECK_SUMMARY: slot_summary.json
          TZ: Asia/Tokyo
        run: |
          set +e
          args=()
          [ "${{ github.event.inputs.mode || 'apply' }}" = "apply" ] && args+=(--apply)
          [ -n "${{ github.event.inputs.start_date }}" ] && args+=(--start-date "${{ github.event.inputs.start_date }}")
          [ -n "${{ github.event.inputs.start_half }}" ] && args+=(--start-half "${{ github.event.inputs.start_half }}")
          [ -n "${{ github.event.inputs.end_date }}" ] && args+=(--end-date "${{ github.event.inputs.end_date }}")
          [ -n "${{ github.event.inputs.end_half }}" ] && args+=(--end-half "${{ github.event.inputs.end_half }}")
          python3 scripts/hpb_slot_check.py "${args[@]}" 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Queue Chatwork status report
        if: always() && (github.event.inputs.mode || 'apply') == 'apply'
        run: |
          if [ "${{ steps.run.outputs.status }}" = "success" ]; then
            python3 scripts/notify_hpb_slot_check.py --status success --summary slot_summary.json --log run.log
          else
            python3 scripts/notify_hpb_slot_check.py --status failure --log run.log
          fi

      - name: Send Chatwork status report
        if: always() && (github.event.inputs.mode || 'apply') == 'apply'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
        run: python3 scripts/chatwork_send.py

      - name: Fail the job if the check itself failed
        if: steps.run.outputs.status == 'failure'
        run: exit 1
