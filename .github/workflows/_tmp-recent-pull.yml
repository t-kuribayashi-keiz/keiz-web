name: _tmp-recent-pull

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth google-api-python-client jpholiday
      - name: Pull Aug 1 - Sep 17 (14 established stores only, GA4+GSC, page-level GSC)
        env:
          GCP_RELAX_KEY: ${{ secrets.GCP_RELAX_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, datetime
          sys.path.insert(0, "scripts")
          import ga4_properties as ga4
          from analytics_discover import credentials, build, ga4_account_summaries, gsc_sites
          from analytics_pull import ga4_property_ids

          BRAND = "リラックス"
          # 2026年08月に既にGSCデータが取れていた(=データ収集が古くから安定している)14店舗のみ。
          # 2026年08月〜現在だけだと店舗によって収集開始時期が違い信頼性が無いため、
          # 8月1日から現在までの約48日間、この14店舗に絞って見る(2026-09-17、栗林さんの判断)。
          ESTABLISHED_STORES = {
              "たまプラーザ東急百貨店", "イオン入間店", "中野坂上店", "中野新橋店",
              "仙川店", "千歳烏山店", "幡ヶ谷店", "新山下店", "方南町店",
              "桜上水店", "梅ヶ丘店", "武蔵小山店", "浦和店", "阿佐ヶ谷店",
          }
          creds = credentials("GCP_RELAX_KEY")
          start = "2026-08-01"
          end = datetime.date.today().isoformat()
          print(f"period: {start} .. {end}", file=sys.stderr)

          # --- GA4: newUsers/convertedUsers per store, summed across channels ---
          data_api = build("analyticsdata", "v1beta", creds)
          summaries = ga4_account_summaries(creds)
          names = [p["displayName"] for s in summaries for p in s.get("propertySummaries", [])
                   if p.get("displayName")]
          id_map = ga4_property_ids(summaries)
          result = ga4.resolve(names, BRAND)

          ga4_out = {}
          for store, display_name in sorted(result["matched"].items()):
              if store not in ESTABLISHED_STORES:
                  continue
              property_id = id_map.get(display_name)
              if not property_id:
                  continue
              resp = data_api.properties().runReport(
                  property=property_id,
                  body={"dateRanges": [{"startDate": start, "endDate": end}],
                        "metrics": [{"name": "newUsers"}]},
              ).execute()
              new_users = 0
              for row in resp.get("rows", []):
                  new_users += int(float(row["metricValues"][0]["value"]))
              conv_resp = data_api.properties().runReport(
                  property=property_id,
                  body={"dateRanges": [{"startDate": start, "endDate": end}],
                        "metrics": [{"name": "activeUsers"}],
                        "dimensionFilter": {"filter": {"fieldName": "isKeyEvent",
                                                        "stringFilter": {"value": "true"}}}},
              ).execute()
              conv_users = 0
              for row in conv_resp.get("rows", []):
                  conv_users += int(float(row["metricValues"][0]["value"]))
              ga4_out[store] = {"newUsers": new_users, "convertedUsers": conv_users}

          # --- GSC: page-level impressions/clicks/ctr/position, per store's homepage ---
          search_console = build("searchconsole", "v1", creds)
          sites = gsc_sites(creds)
          clinics = json.loads(open("data/clinics.json", encoding="utf-8").read())["clinics"]
          by_url = {}
          for c in clinics:
              if c.get("brand") != BRAND:
                  continue
              w = (c.get("website") or "").rstrip("/")
              if w:
                  by_url[w] = c["name"]

          gsc_out = {}
          for site in sites:
              url = site.get("siteUrl", "").rstrip("/")
              store = by_url.get(url)
              if not store or store not in ESTABLISHED_STORES:
                  continue
              resp = search_console.searchanalytics().query(
                  siteUrl=site["siteUrl"],
                  body={"startDate": start, "endDate": end,
                        "dimensions": ["page", "query"], "rowLimit": 500},
              ).execute()
              rows = resp.get("rows", [])
              # ページ単位に集計(店舗合計) + ホームページ(パスがルートのみ)に絞ったクエリ上位
              total_clicks = total_impr = pos_weighted = 0.0
              home_queries = []
              for row in rows:
                  page, query = row["keys"]
                  clicks = row.get("clicks", 0)
                  impressions = row.get("impressions", 0)
                  total_clicks += clicks
                  total_impr += impressions
                  pos_weighted += row.get("position", 0) * impressions
                  # ホームページ = サイトURL直下(末尾スラッシュのみ、それ以上パスが続かない)
                  if page.rstrip("/") == url:
                      home_queries.append((query, impressions, clicks, row.get("position", 0)))
              home_queries.sort(key=lambda x: -x[1])
              gsc_out[store] = {
                  "impressions": total_impr, "clicks": total_clicks,
                  "ctr": (total_clicks / total_impr) if total_impr else None,
                  "position": (pos_weighted / total_impr) if total_impr else None,
                  "top_queries": home_queries[:8],
              }

          print("=== GA4 (newUsers / convertedUsers, 2026年08月〜現在) ===")
          for store in sorted(ga4_out):
              g = ga4_out[store]
              print(f"{store}\tnewUsers={g['newUsers']}\tconvertedUsers={g['convertedUsers']}")

          print()
          print("=== GSC 店舗合計(2026年08月〜現在) ===")
          for store in sorted(gsc_out):
              g = gsc_out[store]
              ctr = f"{g['ctr']:.4f}" if g['ctr'] is not None else "-"
              pos = f"{g['position']:.2f}" if g['position'] is not None else "-"
              print(f"{store}\timpressions={g['impressions']}\tclicks={g['clicks']}\tctr={ctr}\tposition={pos}")

          print()
          print("=== GSC トップページのクエリ上位(2026年08月〜現在) ===")
          for store in sorted(gsc_out):
              print(f"--- {store} ---")
              for q, impr, clicks, pos in gsc_out[store]["top_queries"]:
                  print(f"  {q!r}\timpr={impr}\tclicks={clicks}\tpos={pos:.1f}")

          with open("recent-pull.json", "w", encoding="utf-8") as f:
              json.dump({"ga4": ga4_out, "gsc": gsc_out, "start": start, "end": end}, f, ensure_ascii=False, indent=2)
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: recent-pull
          path: recent-pull.json
          retention-days: 7
