name: Monthly KPI transfer

# Transfers the settled (速報値) numbers into 「【2026年_月次報告】集客数」 for a given month.
# See functions/kpi-aggregation/CLAUDE.md.
#
# Deliberately manual-only — no cron. This writes into a live business spreadsheet, and the
# 速報値 tabs only exist once someone has built them, so there is no date on which running
# unattended is safe. The month is always named explicitly.
#
# The service account key lives only in the GCP_KPI_WRITER_KEY repository secret; it is never
# in the repo and never reaches a Claude session.

on:
  workflow_dispatch:
    inputs:
      month:
        description: "対象月(例: 2026年8月)"
        required: true
        type: string
      trends_csv:
        description: "工程⑥のみ: GoogleトレンドCSVのパス(例 data/trends/2026-08.csv)。指定すると⑥だけを実行する"
        required: false
        type: string
      mode:
        description: "inspect=構造を見るだけ / calibrate=答え合わせ / dry-run=書き込む内容の確認 / apply=本番書き込み"
        required: true
        type: choice
        options:
          - inspect
          - inspect-referral
          - calibrate
          - dry-run
          - apply
        default: calibrate

# Two concurrent runs could write the same row from different reads.
concurrency:
  group: kpi-aggregate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # jpholiday は hpb_slot_check.py の依存。このワークフローでは使わないが、
        # 下のテスト実行が tests/ 全体を読むので、入っていないと import で落ちる。
        run: pip install --quiet google-auth google-api-python-client jpholiday

      - name: Check the parts that need no credentials
        run: python3 -m unittest discover -s tests

      - name: Transfer
        env:
          GCP_KPI_WRITER_KEY: ${{ secrets.GCP_KPI_WRITER_KEY }}
          TZ: Asia/Tokyo
        run: |
          case "${{ inputs.mode }}" in
            inspect)   flag="--inspect" ;;
            inspect-referral) flag="--inspect-referral" ;;
            calibrate) flag="--calibrate" ;;
            apply)     flag="--apply" ;;
            *)         flag="" ;;
          esac
          if [ -n "${{ inputs.trends_csv }}" ]; then
            # 工程⑥。CSVからAO3:AS26だけを書き換える(AT列と正規化ブロックは数式)。
            [ "${{ inputs.mode }}" = "apply" ] && flag="--apply" || flag=""
            python3 scripts/kpi_aggregate.py --month "${{ inputs.month }}" \
              --trends "${{ inputs.trends_csv }}" $flag
          else
            python3 scripts/kpi_aggregate.py --month "${{ inputs.month }}" $flag
          fi
