name: _tmp-gsc-debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth google-api-python-client
      - name: Raw GSC query across unmatched stores and date ranges
        env:
          GCP_RELAX_KEY: ${{ secrets.GCP_RELAX_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          # 前回のpull(2026年08月号)でGSCデータが0件だった11店舗
          stores = [
              "hamadayama", "mito", "fkd", "totsuka", "shimotakaido",
              "sasazuka", "nishishinjuku", "soshigaya", "kugayama",
              "togoshiginza", "koenji",
          ]

          info = json.loads(os.environ["GCP_RELAX_KEY"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/webmasters.readonly"])
          sc = build("searchconsole", "v1", credentials=creds, cache_discovery=False)

          today = datetime.date.today()
          ranges = {
              "2026年08月": ("2026-08-01", "2026-08-31"),
              "直近28日": ((today - datetime.timedelta(days=28)).isoformat(), today.isoformat()),
          }

          for store in stores:
              site_url = f"https://refresh-relax.com/{store}/"
              for label, (start, end) in ranges.items():
                  try:
                      resp = sc.searchanalytics().query(
                          siteUrl=site_url,
                          body={"startDate": start, "endDate": end, "dimensions": ["page"], "rowLimit": 5},
                      ).execute()
                      n = len(resp.get("rows", []))
                      print(f"{store:20s} {label:10s} rows={n}")
                  except Exception as e:
                      print(f"{store:20s} {label:10s} ERROR: {e}")
          EOF
        shell: bash
