name: Clinic master

# 院マスタ(Googleスプレッドシート「診療時間」)から診療時間・定休日を data/clinics.json へ
# 取り込むためのワークフロー。いまは構造を見る --inspect だけ。
#
# data/clinics.json には院名・住所・電話・URL しか入っておらず、時間と定休日は
# 入っていない(2026-09-03に判明)。取り込み元のファイル名が「診療時間」なので
# 取り込んだつもりになりやすい。
#
# スプレッドシートには何も書かない。applyで書き換えるのは data/clinics.json だけで、
# 差分が出たらこのブランチにコミットする。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect=構造と照合率を見るだけ / apply=clinics.jsonに書き込む"
        required: true
        type: choice
        options:
          - inspect
          - apply
        default: inspect

# applyでもスプレッドシートには書かない。書き換えるのはリポジトリの data/clinics.json だけ。
permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # jpholiday は hpb_slot_check.py の依存。このワークフローでは使わないが、
        # 下のテスト実行が tests/ 全体を読むので、入っていないと import で落ちる。
        run: pip install --quiet google-auth google-api-python-client jpholiday

      - name: Check the parts that need no credentials
        run: python3 -m unittest discover -s tests

      - name: Read the clinic master
        env:
          GCP_KPI_WRITER_KEY: ${{ secrets.GCP_KPI_WRITER_KEY }}
          TZ: Asia/Tokyo
        run: python3 scripts/clinic_master.py --${{ inputs.mode }}

      - name: Commit the imported hours
        if: inputs.mode == 'apply'
        run: |
          if git diff --quiet -- data/clinics.json; then
            echo "clinics.json に変化なし。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clinics.json
          git commit -m "Import 診療時間 and 定休 from the clinic master

Filled in by .github/workflows/clinic-master.yml (mode: apply)."
          git push origin HEAD:${{ github.ref_name }}
